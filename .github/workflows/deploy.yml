name: CI/CD Pipeline

on:
  push:
    branches:
      - master # Triggers the workflow every time you push to the master branch

jobs:
  amarolio-client:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your code onto GitHub's server
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Bun environment
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # 3. Install dependencies and build the app (using GitHub's free RAM)
      - name: Build Frontend Assets
        run: |
          bun install
          bun run build

      # 4. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Package the built files into Docker and push it to the cloud
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./client/Dockerfile
          push: true
          # Replace 'amarolio-frontend' with whatever you want to name your image
          tags: ${{ secrets.DOCKER_USERNAME }}/amarolio-client:latest 

      # 6. SSH into your VPS and pull/restart the container
      - name: Deploy Amarolio Client
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root # Change to your VPS username if it's not root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            docker pull ${{ secrets.DOCKER_USERNAME }}/amarolio-client:latest
            
            docker stop amarolio-frontend-container || true
            docker rm amarolio-frontend-container || true
            
            docker run -d \
              --name amarolio-frontend-container \
              -p 5173:80 \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/amarolio-client:latest