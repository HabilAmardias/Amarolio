          password: ${{ secrets.VPS_PASSWORD }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR # 👈 Added missing environment bridge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        script: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull ghcr.io/HabilAmardias/amary-redirect:latest # 👈 Added username namespace
          
          docker stop amary-redirect-container || true
