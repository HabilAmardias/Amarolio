name: Amarolio CI/CD Pipeline

on:
  push:
    branches:
      - master

# Required permissions to write images to GitHub Packages
permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # JOB 1: AMAROLIO CLIENT (Port 5173)
  # ==========================================
  amarolio-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build Frontend Assets
        working-directory: ./client
        run: |
          cat << 'EOF' > .env
          ${{ secrets.PROD_CLIENT_ENV }}
          EOF
          bun install
          bun run build

       Marian- name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ghcr.io/HabilAmardias/amarolio-client:latest 

      - name: Deploy Amarolio Client
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR # 👈 Keeps authentication working
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        script: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull ghcr.io/HabilAmardias/amarolio-client:latest
          
          docker stop amarolio-client-container || true
          docker rm amarolio-client-container || true
          
          docker run -d \
            --name amarolio-client-container \
            -p 5173:80 \
            --restart unless-stopped \
            ghcr.io/HabilAmardias/amarolio-client:latest

  # ==========================================
  # JOB 2: AMARY CLIENT (Port 4173)
  # ==========================================
  amary-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build Frontend Assets
        working-directory: ./amary-client
        run: |
          cat << 'EOF' > .env
          ${{ secrets.PROD_CLIENT_ENV }} # Change secret name here if Amary Client uses different variables
          EOF
          bun install
          bun run build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./amary-client
          file: ./amary-client/Dockerfile
          push: true
          tags: ghcr.io/HabilAmardias/amary-client:latest 

      - name: Deploy Amary Client
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR # 👈 Added missing environment bridge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        script: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull ghcr.io/HabilAmardias/amary-client:latest # 👈 Added username namespace
          
          docker stop amary-client-container || true # 👈 Unique container name
          docker rm amary-client-container || true
          
          docker run -d \
            --name amary-client-container \
            -p 4173:80 \
            --restart unless-stopped \
            ghcr.io/HabilAmardias/amary-client:latest

  # ==========================================
  # JOB 3: AMARY REDIRECT (Port 8000)
  # ==========================================
  amary-redirect:
