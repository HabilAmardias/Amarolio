# deploy/nginx/amarolio.conf
# Amarolio reverse proxy (HTTP only). Docker services bind to 127.0.0.1.
#
# Install on the VPS:
#   sudo ln -s /path/to/repo/deploy/nginx/amarolio.conf /etc/nginx/sites-available/amarolio
#   sudo ln -s /etc/nginx/sites-available/amarolio /etc/nginx/sites-enabled/amarolio
#   sudo nginx -t && sudo systemctl reload nginx

# ---------------- portfolio (amarolio.id) ----------------
server {
    listen 80;
    listen [::]:80;
    server_name amarolio.id;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------- www.amarolio.id -> apex ----------------
server {
    listen 80;
    listen [::]:80;
    server_name www.amarolio.id;
    return 301 $scheme://amarolio.id$request_uri;
}

# ---------------- API gateway ----------------
server {
    listen 80;
    listen [::]:80;
    server_name api.amarolio.id;

    client_max_body_size 2m;
    proxy_read_timeout   60s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;   # required by gateway rate limiter
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# ---------------- auth client ----------------
server {
    listen 80;
    listen [::]:80;
    server_name auth.amarolio.id;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------- amary client ----------------
